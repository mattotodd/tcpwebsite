<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>the Continuity project</title>
    <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/images/site.webmanifest" />

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

    <!-- Keywords -->
    <meta name="keywords" content="the Continuity project, industry, and specialties">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://yourwebsite.com">

    <!-- Author Information -->
    <meta name="author" content="Your Name">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

    <!-- Open Graph (iMessage, Facebook, Slack, Discord, LinkedIn) -->
<meta property="og:title" content="the Continuity project @ Chianti · Sun May 17 · 6pm">
<meta property="og:description" content="live music at Chianti in Beverly from 6 to 9pm. Come hang.">
<meta property="og:image" content="https://continuity.band/images/imresizer-tcp_4_sq.jpg">
<meta property="og:url" content="https://continuity.band">
<meta property="og:type" content="website">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="the Continuity project @ Chianti · Sun May 17 · 6pm">
<meta name="twitter:description" content="live music at Chianti in Beverly from 6 to 9pm. Come hang.">
<meta name="twitter:image" content="https://continuity.band/images/imresizer-tcp_4_sq.jpg">

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/tcp-logo.png" alt="tcp">

            <!-- Replace with your name or brand -->
            <h1>
              <div>the Continuity project</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>funk, r&b and jazz collective</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <a href="https://maps.google.com/?q=Chianti+restaurant"
               target="_blank"
               style="display: flex; max-width: 340px; margin: 0 auto 20px; text-decoration: none; color: inherit; background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; align-items: stretch; transition: transform 0.15s, border-color 0.15s;"
               onmouseover="this.style.transform='translateY(-1px)'; this.style.borderColor='rgba(0,0,0,0.2)'"
               onmouseout="this.style.transform='translateY(0)'; this.style.borderColor='rgba(0,0,0,0.1)'">
              <img src="images/chianti-venue.jpg"
                   alt="Chianti"
                   style="width: 90px; height: 90px; object-fit: cover; flex-shrink: 0; display: block;">
              <div style="padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; flex: 1;">
                <div style="font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.55; margin-bottom: 2px;">Next Show</div>
                <div style="font-size: 15px; font-weight: 600; line-height: 1.2;">Chianti</div>
                <div style="font-size: 13px; opacity: 0.75; margin-top: 2px;">Sun May 17 · 6–9pm</div>
              </div>
            </a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/the.continuity.project/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <form action="https://buttondown.com/api/emails/embed-subscribe/tcp"
                  method="post"
                  target="popupwindow"
                  onsubmit="window.open('https://buttondown.com/tcp', 'popupwindow')"
                  style="max-width: 340px; margin: 12px auto; display: flex; flex-direction: column; gap: 8px;">
              
              <label for="bd-email" style="font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 2px;">
                Join the mailing list
              </label>
              
              <input type="email"
                     name="email"
                     id="bd-email"
                     placeholder="your@email.com"
                     required
                     style="width: 100%; padding: 12px 16px; font-size: 15px; font-family: inherit; border: 1.5px solid rgba(0,0,0,0.15); border-radius: 8px; background: #fff; color: #000; box-sizing: border-box; outline: none; transition: border-color 0.15s;"
                     onfocus="this.style.borderColor='#000'"
                     onblur="this.style.borderColor='rgba(0,0,0,0.15)'">
              
              <button type="submit"
                      style="width: 100%; padding: 12px 16px; font-size: 15px; font-weight: 600; font-family: inherit; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.15s;"
                      onmouseover="this.style.opacity='0.85'"
                      onmouseout="this.style.opacity='1'">
                Subscribe
              </button>
            </form>

              <div style="max-width: 340px; margin: 0 auto 24px; text-align: center;">
  <hr />
</div>
           
              <div style="max-width: 340px; margin: 0 auto 24px; text-align: center;">
  <img src="images/tcp_4_sq.jpg"
       alt="The Band"
       style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; display: block; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
  <div style="margin-top: 12px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.2;"></div>
    <div style="font-size: 13px; color: rgba(0,0,0,0.55); margin-top: 4px;"></div>
  </div>
</div>
      </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="#">© 2026</a>
      </footer>

    </div>
  </div>

</body>

</html>
